# Manual outage failover. The operator stages a git archive of the exact commit
# on a trusted worker; this pipeline never depends on a GitHub checkout.
when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE:
    default: ''
  SOURCE_SHA256:
    default: ''
  CHECK_TARGET:
    default: native
steps:
  - name: verified-source
    image: bash
    commands:
      - |
        set -eu
        : "${SOURCE_ARCHIVE:?Set SOURCE_ARCHIVE to the staged git archive}"
        : "${SOURCE_SHA256:?Set SOURCE_SHA256 to its SHA-256 digest}"
        : "${CI_COMMIT_SHA:?Crow must supply the expected source commit}"
        test -f "$SOURCE_ARCHIVE"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$SOURCE_ARCHIVE" --no-same-owner
  - name: native-checks
    image: bash
    depends_on: [verified-source]
    environment:
      NIX_BUILD_JOBS: '1'
      NIX_BUILD_CORES: '1'
    commands:
      - timeout --signal=TERM --kill-after=30s 30m bash ci/check "${CHECK_TARGET:-native}"
